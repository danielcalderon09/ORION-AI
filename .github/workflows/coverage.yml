name: Coverage Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    name: Generate & Upload Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov networkx opencv-python psutil sqlalchemy aiosqlite pydantic-settings
      
      - name: Run tests with coverage
        run: |
          python -m pytest backend/tests/unit backend/tests/integration \
            --ignore=backend/tests/integration/test_sprint_15_regression.py \
            --cov=backend/src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=70
      
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
      
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: htmlcov/
      
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('coverage.xml', 'utf8');
            // Extract overall coverage percentage from XML
            const match = report.match(/line-rate="([0-9.]+)"/);
            const rate = match ? (parseFloat(match[1]) * 100).toFixed(1) : 'unknown';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Orion AI Coverage Report\n\n**Overall Coverage:** ${rate}%\n\n- Threshold: 70%\n- Full HTML report available in Artifacts\n`
            });
