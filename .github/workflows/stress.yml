name: Nightly Stress Tests

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  workflow_dispatch:

jobs:
  stress:
    name: Stress Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest networkx opencv-python psutil sqlalchemy aiosqlite pydantic-settings
      
      - name: Run stress tests
        run: |
          python -m pytest backend/tests/stress -v --tb=short \
            --junitxml=stress-results.xml
        env:
          ORION_ENV: test
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: stress-results
          path: stress-results.xml
      
      - name: Summary
        if: always()
        run: |
          echo "## Nightly Stress Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f stress-results.xml ]; then
            echo "Completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "Failed or no results" >> $GITHUB_STEP_SUMMARY
          fi
