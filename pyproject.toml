[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-ai"
version = "0.1.0"
description = "AI Powered Intelligent Video Understanding Platform"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Proprietary"}
authors = [
    {name = "Orion AI Team"}
]
keywords = ["video", "ai", "understanding", "editing", "narrative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-socketio>=5.11.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "dependency-injector>=4.41.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.9",
    "loguru>=0.7.0",
    "ffmpeg-python>=0.2.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.3.0",
    "networkx>=3.3.0",
    "pyyaml>=6.0.0",
    "psutil>=5.9.0",
    "faster-whisper>=1.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
planning-openai = [
    "httpx>=0.27,<1.0",
]
gpu = [
    "torch>=2.3.0",
    "onnxruntime-gpu>=1.18.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27,<1.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "memory-profiler>=0.61.0",
    "line-profiler>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend", "backend.src", "backend.src.*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["backend/src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 1
skip_covered = false
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
